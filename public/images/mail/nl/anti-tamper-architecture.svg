<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img" aria-label="Keten van officiële mail: afzendervergrendeling en officiële vlag bij uitgifte, onveranderlijke momentopname en vooraf ingestelde vertaalreserve bij aflevering, client-sandbox en integriteitsmanifest voor verificatie">
  <style>
    .bg { fill: #f8fafc; }
    .band { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .box-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .lbl-blue { font: 700 11px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #2563eb; letter-spacing: 1.4px; }
    .lbl-green { font: 700 11px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #16a34a; letter-spacing: 1.4px; }
    .lbl-amber { font: 700 11px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #d97706; letter-spacing: 1.4px; }
    .t { font: 600 14px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .b { font: 400 11.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .mono { font: 500 11px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #64748b; }
    .arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#pa); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .band { fill: #111827; stroke: #1e293b; }
      .box { fill: #111827; stroke: #1e293b; }
      .box-blue { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .box-green { fill: rgba(34,197,94,0.12); stroke: #22c55e; }
      .box-amber { fill: rgba(245,158,11,0.12); stroke: #f59e0b; }
      .lbl-blue { fill: #60a5fa; }
      .lbl-green { fill: #4ade80; }
      .lbl-amber { fill: #fbbf24; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .mono { fill: #94a3b8; }
      .arrow { stroke: #475569; }
    }
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="480" rx="16"/>
  <rect class="band" x="40" y="35" width="920" height="110" rx="14"/>
  <text class="lbl-blue" x="60" y="58">LAAG 1 · OFFICIËLE AFZENDERIDENTITEIT (UITGIFTE)</text>
  <rect class="box-blue" x="60" y="70" width="270" height="60" rx="10"/>
  <text class="t" x="78" y="93" font-size="13">Vergrendeling officiële afzender</text>
  <text class="mono" x="78" y="112">announcement@epocanvas.com</text>
  <rect class="box" x="355" y="70" width="270" height="60" rx="10"/>
  <text class="t" x="373" y="93" font-size="13">Officiële vlag (isOfficial)</text>
  <text class="b" x="373" y="112">officiële adressen en het label «officieel»</text>
  <rect class="box-green" x="650" y="70" width="290" height="60" rx="10"/>
  <text class="t" x="668" y="93" font-size="13">Insigne en banner in de lezer</text>
  <text class="b" x="668" y="112">officiële mail gemarkeerd in de client</text>
  <path class="arrow" d="M195,145 L195,185"/>
  <path class="arrow" d="M490,145 L490,185"/>
  <path class="arrow" d="M795,145 L795,185"/>
  <rect class="band" x="40" y="190" width="920" height="115" rx="14"/>
  <text class="lbl-amber" x="60" y="213">LAAG 2 · ONVERANDERLIJKE AFLEVERING (OPSLAG)</text>
  <rect class="box" x="60" y="225" width="270" height="64" rx="10"/>
  <text class="t" x="78" y="249" font-size="13">Onveranderlijke momentopname</text>
  <text class="b" x="78" y="268">eenmaal gerenderd bij verzending</text>
  <rect class="box-amber" x="355" y="225" width="270" height="64" rx="10"/>
  <text class="t" x="373" y="249" font-size="13">Vooraf ingestelde vertaalreserve</text>
  <text class="b" x="373" y="268">ongewijzigd: lokaal ; gewijzigd: AI</text>
  <rect class="box" x="650" y="225" width="290" height="64" rx="10"/>
  <text class="t" x="668" y="249" font-size="13">Levenscyclus en versleuteling</text>
  <text class="b" x="668" y="268">vervalt na ingestelde dagen (standaard 7)</text>
  <path class="arrow" d="M195,305 L195,345"/>
  <path class="arrow" d="M490,305 L490,345"/>
  <path class="arrow" d="M795,305 L795,345"/>
  <rect class="band" x="40" y="350" width="920" height="105" rx="14"/>
  <text class="lbl-green" x="60" y="373">LAAG 3 · CLIENT-SANDBOX EN INTEGRITEIT (VERIFICATIE)</text>
  <rect class="box-green" x="60" y="383" width="270" height="58" rx="10"/>
  <text class="t" x="78" y="405" font-size="13">Shadow DOM-isolatie</text>
  <text class="b" x="78" y="423">paginastijlen en -scripts zonder effect</text>
  <rect class="box" x="355" y="383" width="270" height="58" rx="10"/>
  <text class="t" x="373" y="405" font-size="13">DOMPurify-whitelist</text>
  <text class="b" x="373" y="423">script · iframe · embed · form verwijderd</text>
  <rect class="box-blue" x="650" y="383" width="290" height="58" rx="10"/>
  <text class="t" x="668" y="405" font-size="13">Integriteitsmanifest</text>
  <text class="b" x="668" y="423">tamper-proof.json · SHA-256 · git-commitanker</text>
</svg>

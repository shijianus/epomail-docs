<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" role="img" aria-label="Architectuur van de juridische documenten: de Servicevoorwaarden als contractlaag, het Privacybeleid en het beleid voor acceptabel gebruik als beleidslaag, gegevensverwerking en verwerkers als ondersteunende documenten, op het toepasselijke recht en beveiligingsverplichtingen">
  <style>
    .bg { fill: #f8fafc; }
    .layer { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .top { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .t { font: 600 15px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .b { font: 400 11.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #2563eb; }
    .law { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .vline { stroke: #cbd5e1; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .layer { fill: #111827; stroke: #1e293b; }
      .top { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .base { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .law { fill: #94a3b8; }
      .vline { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="1000" height="430" rx="16"/>
  <rect class="top" x="250" y="46" width="500" height="86" rx="12"/>
  <text class="tag" x="274" y="72">CONTRACTLAAG</text>
  <text class="t" x="274" y="94">Servicevoorwaarden</text>
  <text class="b" x="274" y="110">Elektronische toestemming: dezelfde kracht als een schriftelijke handtekening</text>
  <text class="b" x="274" y="126">Volledige tekst gepubliceerd voor controle · herzieningen gearchiveerd in de open-sourcebron</text>
  <line class="vline" x1="360" y1="132" x2="360" y2="168"/>
  <line class="vline" x1="500" y1="132" x2="500" y2="168"/>
  <line class="vline" x1="640" y1="132" x2="640" y2="168"/>
  <rect class="layer" x="70" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="90" y="194" font-size="13">Privacybeleid</text>
  <text class="b" x="90" y="214">Wat we verzamelen en waarom · verwerkingsnormen</text>
  <rect class="layer" x="380" y="168" width="240" height="66" rx="12"/>
  <text class="t" x="400" y="194" font-size="13">Beleid voor acceptabel gebruik</text>
  <text class="b" x="400" y="214">Gedragsgrenzen en handhaving</text>
  <rect class="layer" x="640" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="660" y="194" font-size="13">Gegevens en beveiliging · Verwerkers</text>
  <text class="b" x="660" y="214">Beveiligingsmaatregelen · lijst van verwerkers</text>
  <rect class="base" x="70" y="266" width="860" height="100" rx="12"/>
  <text class="tag" x="94" y="292">JURIDISCH KADER</text>
  <text class="t" x="94" y="316" font-size="13.5">Recht van de vestigingsplaats van de exploitant — gehoste instantie: Taiwanees recht, rechtbank Taipei</text>
  <text class="b" x="94" y="336">Manifest onredelijke standaardbedingen binden niet onder toepasselijk recht</text>
  <text class="b" x="94" y="352">Aansprakelijkheid die het recht niet laat uitsluiten, valt niet onder plafonds</text>
  <text class="law" x="94" y="400">VOLGORDE: het document over het eigen onderwerp prevaleert · de traditioneel Chinese (Taiwan) versie is leidend</text>
</svg>

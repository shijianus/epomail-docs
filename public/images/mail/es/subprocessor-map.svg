<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Mapa de encargados: una instancia, cuatro categorías de cesión — encargados, servicios autorizados, IA activada por usted y requerimiento legal">
  <style>
    .bg { fill: #f8fafc; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
    .grp { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .gt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .gb { font: 400 11.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1px; fill: #2563eb; }
    .hub-t { font: 600 15px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .hub-b { font: 400 11px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .hub { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .grp { fill: #111827; stroke: #1e293b; }
      .gt { fill: #f1f5f9; }
      .gb { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .hub-t { fill: #f1f5f9; }
      .hub-b { fill: #94a3b8; }
      .line { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="1000" height="470" rx="16"/>
  <rect class="hub" x="390" y="185" width="220" height="100" rx="14"/>
  <text class="hub-t" x="414" y="222">EpoCanvas Mail</text>
  <text class="hub-t" x="414" y="242">instancia</text>
  <text class="hub-b" x="414" y="264">cesión mínima necesaria · sin venta,</text>
  <text class="hub-b" x="414" y="280">sin publicidad, sin rastreadores</text>
  <rect class="grp" x="48" y="48" width="290" height="120" rx="12"/>
  <text class="tag" x="70" y="74">ENCARGADOS</text>
  <text class="gt" x="70" y="98">Cloudflare · Resend / Mailjet</text>
  <text class="gb" x="70" y="120">Infraestructura y entrega saliente.</text>
  <text class="gb" x="70" y="138">SOC 2 Type II · ISO/IEC 27001 · SCC UE.</text>
  <text class="gb" x="70" y="156">Contenido completo solo para el envío saliente.</text>
  <rect class="grp" x="662" y="48" width="290" height="120" rx="12"/>
  <text class="tag" x="684" y="74">AUTORIZADOS POR USTED</text>
  <text class="gt" x="684" y="98">Telegram · Apps OAuth · Linux DO</text>
  <text class="gb" x="684" y="120">solo con su consentimiento ; ámbito</text>
  <text class="gb" x="684" y="138">openid / profile / email ; revocable en</text>
  <text class="gb" x="684" y="156">cualquier momento y sin demora.</text>
  <rect class="grp" x="48" y="302" width="290" height="120" rx="12"/>
  <text class="tag" x="70" y="328">IA ACTIVADA POR USTED</text>
  <text class="gt" x="70" y="352" font-size="12.5">Punto de modelos · Workers AI · MyMemory</text>
  <text class="gb" x="70" y="374">Traducción y OCR solo por su iniciativa.</text>
  <text class="gb" x="70" y="392">La extracción de códigos es el único paso IA</text>
  <text class="gb" x="70" y="410">automático (opcional ; 6.000 caracteres).</text>
  <rect class="grp" x="662" y="302" width="290" height="120" rx="12"/>
  <text class="tag" x="684" y="328">POR REQUERIMIENTO LEGAL</text>
  <text class="gt" x="684" y="352">Autoridades competentes</text>
  <text class="gb" x="684" y="374">solo requerimiento legal ; divulgación</text>
  <text class="gb" x="684" y="392">mínima ; legalidad verificada ; aviso</text>
  <text class="gb" x="684" y="410">donde la ley lo permita.</text>
  <path class="line" d="M390,210 C330,196 340,150 338,140"/>
  <path class="line" d="M610,210 C670,196 660,150 662,140"/>
  <path class="line" d="M390,260 C330,274 340,320 338,330"/>
  <path class="line" d="M610,260 C670,274 660,320 662,330"/>
</svg>

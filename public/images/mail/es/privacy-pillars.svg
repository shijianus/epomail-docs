<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Cinco pilares de la Política de Privacidad sobre la base de la supervisión: recopilación, uso, transferencia, seguridad, sus derechos — bajo el derecho aplicable de protección de datos">
  <style>
    .bg { fill: #f8fafc; }
    .roof { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pillar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .pt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .pb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #2563eb; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .bt { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .roof-t { font: 600 14.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .roof { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .pillar { fill: #111827; stroke: #1e293b; }
      .pt { fill: #f1f5f9; }
      .pb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .base { fill: #111827; stroke: #1e293b; }
      .bt { fill: #f1f5f9; }
      .roof-t { fill: #f1f5f9; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <rect class="roof" x="60" y="40" width="880" height="64" rx="12"/>
  <text class="roof-t" x="84" y="68" font-size="13">Derecho aplicable — deber de información: qué, por qué, cuánto tiempo y qué puede hacer</text>
  <text class="law" x="84" y="90">SE APLICA A TODA ACTIVIDAD DE TRATAMIENTO DESCRITA EN ESTA POLÍTICA</text>
  <rect class="pillar" x="60" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="78" y="168">Recopilación</text>
  <text class="pb" x="78" y="190">Necesidad contractual ;</text>
  <text class="pb" x="78" y="206">consentimiento para</text>
  <text class="pb" x="78" y="222">funciones de IA</text>
  <text class="law" x="78" y="262">CONTRATO · CONSENTIMIENTO</text>
  <rect class="pillar" x="230" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="248" y="168">Uso</text>
  <text class="pb" x="248" y="190">dentro de la finalidad ;</text>
  <text class="pb" x="248" y="206">oposición al marketing</text>
  <text class="pb" x="248" y="222">en cualquier momento</text>
  <text class="law" x="248" y="262">LIMITACIÓN DE FINALIDAD</text>
  <rect class="pillar" x="400" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="418" y="168">Transferencia</text>
  <text class="pb" x="418" y="190">transfronteriza vía</text>
  <text class="pb" x="418" y="206">Cloudflare ; respeta</text>
  <text class="pb" x="418" y="222">restricciones legales</text>
  <text class="law" x="418" y="262">GARANTÍAS DE TRANSFERENCIA</text>
  <rect class="pillar" x="570" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="588" y="168">Seguridad</text>
  <text class="pb" x="588" y="190">cifrado, bloqueo,</text>
  <text class="pb" x="588" y="206">auditorías — medidas</text>
  <text class="pb" x="588" y="222">mejoradas sin cesar</text>
  <text class="law" x="588" y="262">MEDIDAS DE SEGURIDAD</text>
  <rect class="pillar" x="740" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="758" y="168">Sus derechos</text>
  <text class="pb" x="758" y="190">consultar, copiar,</text>
  <text class="pb" x="758" y="206">rectificar, parar,</text>
  <text class="pb" x="758" y="222">suprimir — § 9</text>
  <text class="law" x="758" y="262">DERECHOS Y RECURSOS</text>
  <rect class="base" x="60" y="312" width="880" height="56" rx="12"/>
  <text class="bt" x="84" y="336" font-size="12">Base: supervisión de la autoridad competente del lugar del operador</text>
  <text class="law" x="84" y="356">DERECHO APLICABLE DE LA JURISDICCIÓN DEL OPERADOR DE CADA INSTANCIA</text>
</svg>

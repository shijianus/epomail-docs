<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Límites de responsabilidad: el proyecto de código abierto original, el operador de la instancia como responsable del tratamiento y usted como interesado">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .title { font: 600 17px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .body { font: 400 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #64748b; }
    .accent { fill: #2563eb; }
    .arrow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .foot { font: 400 12px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .card-accent { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .title { fill: #f1f5f9; }
      .body { fill: #94a3b8; }
      .tag { fill: #64748b; }
      .accent { fill: #60a5fa; }
      .arrow { stroke: #475569; }
      .foot { fill: #94a3b8; }
      .divider { stroke: #1e293b; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="470" rx="16"/>
  <rect class="card" x="60" y="52" width="270" height="130" rx="12"/>
  <text class="tag" x="84" y="80">ORIGINAL · LICENCIA MIT</text>
  <text class="title" x="84" y="106">Proyecto de código abierto</text>
  <text class="body" x="84" y="130">Solo publica el código fuente.</text>
  <text class="body" x="84" y="150">No opera ningún servicio de correo,</text>
  <text class="body" x="84" y="170">no custodia datos, cero telemetría.</text>
  <rect class="card-accent" x="390" y="52" width="270" height="130" rx="12"/>
  <text class="tag accent" x="414" y="80">INSTANCIA · RESPONSABLE DEL TRATAMIENTO</text>
  <text class="title" x="414" y="106">Operador de la instancia</text>
  <text class="body" x="414" y="130">Se despliega en su propia cuenta Cloudflare</text>
  <text class="body" x="414" y="150">(Workers · D1 · KV · R2) y asume los</text>
  <text class="body" x="414" y="170">deberes de protección: información, seguridad, supervisión.</text>
  <rect class="card" x="720" y="52" width="220" height="130" rx="12"/>
  <text class="tag" x="744" y="80">INTERESADO</text>
  <text class="title" x="744" y="106">Usted</text>
  <text class="body" x="744" y="130">Registra una cuenta y confía</text>
  <text class="body" x="744" y="150">sus buzones y sus mensajes</text>
  <text class="body" x="744" y="170">a la instancia.</text>
  <path class="arrow" d="M330,117 L382,117"/>
  <path class="arrow" d="M660,117 L712,117"/>
  <text class="foot" x="340" y="106">código</text>
  <text class="foot" x="672" y="106">confianza</text>
  <line class="divider" x1="60" y1="228" x2="940" y2="228"/>
  <rect class="card" x="60" y="262" width="880" height="150" rx="12"/>
  <text class="tag" x="84" y="290">QUÉ SIGNIFICA</text>
  <text class="title" x="84" y="318" font-size="15.5">El operador con quien se registra es su responsable del tratamiento — no los autores originales.</text>
  <text class="body" x="84" y="344">• Instancia alojada mail.epocanvas.com: el equipo de EpoCanvas es responsable de los datos de cuenta y los registros de seguridad.</text>
  <text class="body" x="84" y="366">• Instancia autoalojada: quien la despliega se convierte en el único responsable del tratamiento desde el despliegue.</text>
  <text class="body" x="84" y="388">• Los documentos jurídicos de este sitio se aplican por instancia; el acuerdo se celebra con el operador de la instancia de registro.</text>
</svg>

  <text class="b" x="234" y="190">este sitio sirve de plantilla</text>
  <rect class="base" x="26" y="222" width="364" height="36" rx="10"/>
  <text class="bt" x="44" y="238">Autores originales:</text>
  <text class="b" x="44" y="251">ningún servicio de correo · ningún dato de usuarios · ninguna responsabilidad de operación</text>

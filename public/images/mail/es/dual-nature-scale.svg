      .base { fill: #111827; stroke: #1e293b; }
      .chip { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .tagg { fill: #94a3b8; }
      .bt { fill: #cbd5e1; }
      .mid { stroke: #334155; }

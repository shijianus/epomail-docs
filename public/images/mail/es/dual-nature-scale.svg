<svg width="416" height="276" viewBox="0 0 416 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gobernanza de doble vía: una base de código con licencia MIT, dos vías de operación independientes con responsables del tratamiento distintos">
  <style>
    .bg { fill: #f8fafc; }

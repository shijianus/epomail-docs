  <rect class="bg" width="416" height="276" rx="16"/>
  <text class="tag" x="26" y="26">GOBERNANZA DE DOBLE VÍA</text>
  <rect class="chip" x="108" y="38" width="200" height="34" rx="10"/>
  <text class="t" x="208" y="53" text-anchor="middle" font-size="9.5">Una base de código abierto (MIT)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Cinq piliers de la politique de confidentialité sur le socle de la surveillance : collecte, utilisation, transfert, sécurité, vos droits — sous le droit applicable de protection des données">
  <style>
    .bg { fill: #f8fafc; }
    .roof { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pillar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .pt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .pb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #2563eb; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .bt { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .roof-t { font: 600 14.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .roof { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .pillar { fill: #111827; stroke: #1e293b; }
      .pt { fill: #f1f5f9; }
      .pb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .base { fill: #111827; stroke: #1e293b; }
      .bt { fill: #f1f5f9; }
      .roof-t { fill: #f1f5f9; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <rect class="roof" x="60" y="40" width="880" height="64" rx="12"/>
  <text class="roof-t" x="84" y="68" font-size="13">Droit applicable — devoir d’information : quoi, pourquoi, combien de temps, vos recours</text>
  <text class="law" x="84" y="90">S’APPLIQUE À TOUTE ACTIVITÉ DE TRAITEMENT DÉCRITE DANS LA PRÉSENTE POLITIQUE</text>
  <rect class="pillar" x="60" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="78" y="168">Collecte</text>
  <text class="pb" x="78" y="190">Nécessité contractuelle ;</text>
  <text class="pb" x="78" y="206">consentement pour</text>
  <text class="pb" x="78" y="222">les fonctions IA</text>
  <text class="law" x="78" y="262">CONTRAT · CONSENTEMENT</text>
  <rect class="pillar" x="230" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="248" y="168">Utilisation</text>
  <text class="pb" x="248" y="190">dans la finalité ;</text>
  <text class="pb" x="248" y="206">opposition au</text>
  <text class="pb" x="248" y="222">marketing à tout moment</text>
  <text class="law" x="248" y="262">LIMITATION DES FINALITÉS</text>
  <rect class="pillar" x="400" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="418" y="168">Transfert</text>
  <text class="pb" x="418" y="190">transfrontalier via</text>
  <text class="pb" x="418" y="206">Cloudflare ; respecte</text>
  <text class="pb" x="418" y="222">les restrictions légales</text>
  <text class="law" x="418" y="262">GARANTIES DE TRANSFERT</text>
  <rect class="pillar" x="570" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="588" y="168">Sécurité</text>
  <text class="pb" x="588" y="190">chiffrement, blocage,</text>
  <text class="pb" x="588" y="206">audits — mesures</text>
  <text class="pb" x="588" y="222">améliorées en continu</text>
  <text class="law" x="588" y="262">MESURES DE SÉCURITÉ</text>
  <rect class="pillar" x="740" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="758" y="168">Vos droits</text>
  <text class="pb" x="758" y="190">consulter, copier,</text>
  <text class="pb" x="758" y="206">rectifier, stopper,</text>
  <text class="pb" x="758" y="222">supprimer — § 9</text>
  <text class="law" x="758" y="262">DROITS & RECOURS</text>
  <rect class="base" x="60" y="312" width="880" height="56" rx="12"/>
  <text class="bt" x="84" y="336" font-size="12">Socle : surveillance par l’autorité compétente du lieu de l’exploitant</text>
  <text class="law" x="84" y="356">DROIT APPLICABLE DE LA JURIDICTION DE L’EXPLOITANT DE CHAQUE INSTANCE</text>
</svg>

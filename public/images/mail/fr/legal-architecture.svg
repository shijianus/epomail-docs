<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" role="img" aria-label="Architecture des documents juridiques : les Conditions d'utilisation en couche contractuelle, la Politique de confidentialité et la Politique d'utilisation acceptable en couche politique, le traitement des données et les sous-traitants en documents d'appui, sur le socle du droit applicable et des obligations de sécurité">
  <style>
    .bg { fill: #f8fafc; }

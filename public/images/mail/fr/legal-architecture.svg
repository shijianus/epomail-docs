  <rect class="base" x="70" y="266" width="860" height="100" rx="12"/>
  <text class="tag" x="94" y="292">CADRE JURIDIQUE</text>
  <text class="t" x="94" y="316" font-size="13.5">Droit du lieu de l’exploitant — instance hébergée : droit taïwanais, tribunal de district de Taipei</text>
  <text class="b" x="94" y="336">Les clauses types manifestement déloyales ne lient pas en droit applicable</text>
  <text class="b" x="94" y="352">La responsabilité que le droit ne permet pas d’exclure n’est pas plafonnée</text>
  <text class="law" x="94" y="400">ORDRE DE PRÉSÉANCE : le document propre au sujet prévaut · la version en chinois traditionnel (Taïwan) fait autorité</text>

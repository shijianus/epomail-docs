      .bg { fill: #0b0f19; }
      .layer { fill: #111827; stroke: #1e293b; }
      .top { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .base { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .law { fill: #94a3b8; }
      .vline { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="1000" height="430" rx="16"/>
  <rect class="top" x="250" y="46" width="500" height="86" rx="12"/>
  <text class="tag" x="274" y="72">COUCHE CONTRACTUELLE</text>
  <text class="t" x="274" y="94">Conditions d'utilisation</text>
  <text class="b" x="274" y="110">Consentement électronique : même valeur qu’une signature écrite</text>
  <text class="b" x="274" y="126">Texte intégral publié pour examen · révisions archivées dans le dépôt open source</text>
  <line class="vline" x1="360" y1="132" x2="360" y2="168"/>
  <line class="vline" x1="500" y1="132" x2="500" y2="168"/>
  <line class="vline" x1="640" y1="132" x2="640" y2="168"/>
  <rect class="layer" x="70" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="90" y="194" font-size="13">Politique de confidentialité</text>
  <text class="b" x="90" y="214">Ce que nous collectons et pourquoi · normes de traitement</text>
  <rect class="layer" x="380" y="168" width="240" height="66" rx="12"/>
  <text class="t" x="400" y="194" font-size="13">Politique d'utilisation acceptable</text>
  <text class="b" x="400" y="214">Limites de conduite et exécution</text>
  <rect class="layer" x="640" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="660" y="194" font-size="13">Données et sécurité · Sous-traitants</text>

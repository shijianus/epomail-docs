  <defs>
    <marker id="lh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mh" d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <rect class="band" x="60" y="36" width="880" height="56" rx="10"/>
  <text class="bt" x="84" y="60">Tolérance zéro — exploitation sexuelle d’enfants :</text>
  <text class="b0" x="84" y="80">suppression immédiate et clôture du compte, preuves conservées, signalement à l’autorité — pas de délai de recours</text>
  <rect class="s1" x="60"  y="300" width="150" height="56" rx="10"/>
  <text class="t" x="76" y="324">1 · Avertissement</text>
  <text class="b" x="76" y="342">premier écart mineur</text>
  <rect class="s2" x="234" y="252" width="150" height="56" rx="10"/>
  <text class="t" x="250" y="276">2 · Limitation</text>
  <text class="b" x="250" y="294">envoi et API réduits</text>
  <rect class="s3" x="408" y="204" width="150" height="56" rx="10"/>
  <text class="t" x="424" y="228">3 · Quarantaine</text>
  <text class="b" x="424" y="246">vers les indésirables</text>
  <rect class="s4" x="582" y="156" width="150" height="56" rx="10"/>
  <text class="t" x="598" y="180">4 · Suspension</text>
  <text class="b" x="598" y="198">accès suspendu</text>
  <rect class="s5" x="756" y="108" width="150" height="56" rx="10"/>
  <text class="t" x="772" y="132">5 · Suppression</text>
  <text class="b" x="772" y="150">définitive, irréversible</text>
  <path class="loop" d="M820,168 C866,240 736,318 540,330 C380,340 250,334 218,318"/>
  <text class="loop-t" x="470" y="356">Recours et signalement — réponse dans un délai raisonnable ;</text>
  <text class="loop-t" x="470" y="372">information préalable sauf urgence</text>
  <text class="tag" x="60" y="378">ÉCHELLE PROPORTIONNÉE À LA GRAVITÉ</text>
</svg>

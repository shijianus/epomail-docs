<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img" aria-label="EpoCanvas Mail Data Security Processing Pipeline: Minimalist Ingestion, Edge V8 Isolate Compute, AES-256-GCM Envelope Encryption, Tiered Cloudflare Storage, and Cryptographic Shredding">
  <defs>
    <linearGradient id="edgeGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="edgeGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: url(#softShadow); }
    .card-active { fill: url(#edgeGradLight); stroke: #3b82f6; stroke-width: 1.8; filter: url(#softShadow); }
    .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .chip-accent { fill: #dbeafe; stroke: #bfdbfe; stroke-width: 1; }
    .title-main { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .card-title { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .card-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #475569; line-height: 1.5; }
    .badge-txt { font: 700 10px -apple-system, BlinkMacSystemFont, sans-serif; fill: #1d4ed8; letter-spacing: 0.5px; }
    .chip-txt { font: 600 10.5px ui-monospace, SFMono-Regular, monospace; fill: #334155; }
    .flow-line { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 6 4; fill: none; marker-end: url(#pipeArrow); }
    .storage-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .icon-symbol { fill: #2563eb; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .card-active { fill: url(#edgeGradDark); stroke: #3b82f6; }
      .chip { fill: #1e293b; stroke: #334155; }
      .chip-accent { fill: rgba(37,99,235,0.25); stroke: #2563eb; }
      .title-main { fill: #f8fafc; }
      .card-title { fill: #f1f5f9; }
      .card-sub { fill: #94a3b8; }
      .badge-txt { fill: #93c5fd; }
      .chip-txt { fill: #cbd5e1; }
      .flow-line { stroke: #60a5fa; }
      .storage-box { fill: #111827; stroke: #1e293b; }
      .icon-symbol { fill: #60a5fa; }
    }
  </style>

  <!-- Canvas Background -->
  <rect class="bg" width="1000" height="480" rx="16"/>

  <!-- Top Title Banner -->
  <text class="title-main" x="40" y="44">EpoCanvas Mail · 全链路数据处理与生命周期安全流水线</text>
  <rect class="chip-accent" x="650" y="27" width="310" height="24" rx="12"/>
  <text class="badge-txt" x="662" y="43">ZERO TELEMETRY · EPHEMERAL V8 ISOLATE</text>

  <!-- 3 Top Step Cards: Ingestion -> Edge V8 -> Crypto Engine -->
  <!-- Step 1: Ingestion -->
  <g transform="translate(40, 75)">
    <rect class="card" width="285" height="185" rx="12"/>
    <rect class="chip-accent" x="16" y="16" width="76" height="22" rx="6"/>
    <text class="badge-txt" x="25" y="31">PHASE 1</text>
    <text class="card-title" x="16" y="62">最小化采集与入口防护</text>
    <text class="card-sub" x="16" y="86">• 仅收集基础注册标识 (用户名/别名)</text>
    <text class="card-sub" x="16" y="106">• 绝无通讯录、设备陀螺仪与剪贴板读取</text>
    <text class="card-sub" x="16" y="126">• 绝对零遥测 (No Tracking SDK / Beacon)</text>
    <text class="card-sub" x="16" y="146">• 强制端到端 TLS 1.3 与 HSTS 预加载</text>
    <rect class="chip" x="16" y="156" width="253" height="18" rx="4"/>
    <text class="chip-txt" x="22" y="169">INPUT: Clean Payloads &amp; Zero Trackers</text>
  </g>

  <!-- Step 2: Edge V8 Isolate -->
  <g transform="translate(355, 75)">
    <rect class="card-active" width="290" height="185" rx="12"/>
    <rect class="chip-accent" x="16" y="16" width="76" height="22" rx="6"/>
    <text class="badge-txt" x="25" y="31">PHASE 2</text>
    <text class="card-title" x="16" y="62">边缘瞬时执行与内存隔离</text>
    <text class="card-sub" x="16" y="86">• Cloudflare Workers 纳秒级 V8 Isolate</text>
    <text class="card-sub" x="16" y="106">• 运行于全球 300+ 离用户最近 Anycast 节点</text>
    <text class="card-sub" x="16" y="126">• 无状态瞬时执行，请求结束即刻物理销毁</text>
    <text class="card-sub" x="16" y="146">• 杜绝跨租户内存残留与宿主磁盘泄露</text>
    <rect class="chip" x="16" y="156" width="258" height="18" rx="4"/>
    <text class="chip-txt" x="22" y="169">COMPUTE: Isolated Ephemeral Memory</text>
  </g>

  <!-- Step 3: Crypto Engine -->
  <g transform="translate(675, 75)">
    <rect class="card" width="285" height="185" rx="12"/>
    <rect class="chip-accent" x="16" y="16" width="76" height="22" rx="6"/>
    <text class="badge-txt" x="25" y="31">PHASE 3</text>
    <text class="card-title" x="16" y="62">静态信封加密与密钥派生</text>
    <text class="card-sub" x="16" y="86">• 工业级 AES-256-GCM 认证加密引擎</text>
    <text class="card-sub" x="16" y="106">• PBKDF2 (100,000 次加盐迭代) 保护口令</text>
    <text class="card-sub" x="16" y="126">• TOTP 种子密钥基于主密钥静态加密</text>
    <text class="card-sub" x="16" y="146">• 运行环境变量动态注入，密钥隔离存储</text>
    <rect class="chip" x="16" y="156" width="253" height="18" rx="4"/>
    <text class="chip-txt" x="22" y="169">CRYPTO: AES-256-GCM + Auth Tags</text>
  </g>

  <!-- Flow Arrows connecting Phase 1 -> 2 -> 3 -->
  <path class="flow-line" d="M 325 167 L 350 167"/>
  <path class="flow-line" d="M 645 167 L 670 167"/>

  <!-- Flow Down to Storage Tier -->
  <path class="flow-line" d="M 817 260 L 817 290"/>
  <path class="flow-line" d="M 500 260 L 500 290"/>
  <path class="flow-line" d="M 182 260 L 182 290"/>

  <!-- Bottom Tier: Storage Separation &amp; Irreversible Purge -->
  <g transform="translate(40, 295)">
    <rect class="storage-box" width="605" height="155" rx="12"/>
    <text class="card-title" x="24" y="30">底层存储分层矩阵 (Tiered Cloudflare Infrastructure)</text>
    
    <!-- D1 -->
    <rect class="chip" x="24" y="45" width="170" height="92" rx="8"/>
    <text class="badge-txt" x="36" y="66">CLOUDFLARE D1</text>
    <text class="card-sub" x="36" y="86">关系型数据库</text>
    <text class="card-sub" x="36" y="104">账号凭证 / 邮件元数据</text>
    <text class="card-sub" x="36" y="122">AES-256-GCM 密文正文</text>

    <!-- KV -->
    <rect class="chip" x="210" y="45" width="180" height="92" rx="8"/>
    <text class="badge-txt" x="222" y="66">CLOUDFLARE KV</text>
    <text class="card-sub" x="222" y="86">全球分布式键值缓存</text>
    <text class="card-sub" x="222" y="104">JWT 会话 (30日滑动 TTL)</text>
    <text class="card-sub" x="222" y="122">15 条环境指纹 / 防爆计数</text>

    <!-- R2 / S3 -->
    <rect class="chip" x="406" y="45" width="185" height="92" rx="8"/>
    <text class="badge-txt" x="418" y="66">R2 / BYO-S3 OBJECTS</text>
    <text class="card-sub" x="418" y="86">大型附件与二进制负载</text>
    <text class="card-sub" x="418" y="104">自备 S3 / 原生 R2 优先解析</text>
    <text class="card-sub" x="418" y="122">Nosniff + 附件防御头强制</text>
  </g>

  <!-- Right Box: Irreversible Shredding -->
  <g transform="translate(665, 295)">
    <rect class="card-active" width="295" height="155" rx="12"/>
    <rect class="chip-accent" x="18" y="16" width="90" height="22" rx="6"/>
    <text class="badge-txt" x="27" y="31">SHREDDING</text>
    <text class="card-title" x="18" y="62">被遗忘权与物理擦除机制</text>
    <text class="card-sub" x="18" y="86">• 回收站 7 日防误删缓冲到期自动擦除</text>
    <text class="card-sub" x="18" y="104">• 信箱用量逾 90% 触发紧急实体释放</text>
    <text class="card-sub" x="18" y="122">• 账号注销立即抹除 D1 / KV 关联数据</text>
    <text class="card-sub" x="18" y="140">• 派生主密钥物理覆写粉碎，彻底灭失</text>
  </g>

</svg>

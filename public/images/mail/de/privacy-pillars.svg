<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Fünf Säulen der Datenschutzerklärung auf dem Fundament der Aufsicht: Erhebung, Nutzung, Übertragung, Sicherheit und Ihre Rechte — unter dem anwendbaren Datenschutzrecht">
  <style>
    .bg { fill: #f8fafc; }
    .roof { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pillar { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .pt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .pb { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .law { font: 600 10px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #2563eb; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .bt { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .roof-t { font: 600 14.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .roof { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .pillar { fill: #111827; stroke: #1e293b; }
      .pt { fill: #f1f5f9; }
      .pb { fill: #94a3b8; }
      .law { fill: #60a5fa; }
      .base { fill: #111827; stroke: #1e293b; }
      .bt { fill: #f1f5f9; }
      .roof-t { fill: #f1f5f9; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <rect class="roof" x="60" y="40" width="880" height="64" rx="12"/>
  <text class="roof-t" x="84" y="68" font-size="13">Anwendbares Datenschutzrecht — Informationspflicht: was wir erheben, warum, wie lange und was Sie tun können</text>
  <text class="law" x="84" y="90">GILT FÜR ALLE IN DIESER RICHTLINIE BESCHRIEBENEN VERARBEITUNGSAKTIVITÄTEN</text>
  <rect class="pillar" x="60" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="78" y="168">Erhebung</text>
  <text class="pb" x="78" y="190">Vertragserfordernis;</text>
  <text class="pb" x="78" y="206">Einwilligung nur für</text>
  <text class="pb" x="78" y="222">optionale KI</text>
  <text class="law" x="78" y="262">VERTRAG · EINWILLIGUNG</text>
  <rect class="pillar" x="230" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="248" y="168">Nutzung</text>
  <text class="pb" x="248" y="190">Im Zweck festgelegt;</text>
  <text class="pb" x="248" y="206">Widerspruch gegen</text>
  <text class="pb" x="248" y="222">Marketing jederzeit</text>
  <text class="law" x="248" y="262">ZWECKBEGRENZUNG</text>
  <rect class="pillar" x="400" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="418" y="168">Übertragung</text>
  <text class="pb" x="418" y="190">Grenzüberschreitend</text>
  <text class="pb" x="418" y="206">über Cloudflare; hält</text>
  <text class="pb" x="418" y="222">gesetzliche Grenzen ein</text>
  <text class="law" x="418" y="262">ÜBERTRAGUNGSGARANTIEN</text>
  <rect class="pillar" x="570" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="588" y="168">Sicherheit</text>
  <text class="pb" x="588" y="190">Verschlüsselung, Sperre,</text>
  <text class="pb" x="588" y="206">Audits — Maßnahmen</text>
  <text class="pb" x="588" y="222">laufend verbessert</text>
  <text class="law" x="588" y="262">SICHERHEITSMASSNAHMEN</text>
  <rect class="pillar" x="740" y="140" width="160" height="140" rx="10"/>
  <text class="pt" x="758" y="168">Ihre Rechte</text>
  <text class="pb" x="758" y="190">Auskunft, Kopie,</text>
  <text class="pb" x="758" y="206">Berichtigung, Stopp,</text>
  <text class="pb" x="758" y="222">Löschung — § 9</text>
  <text class="law" x="758" y="262">RECHTE &amp; ABHILFE</text>
  <rect class="base" x="60" y="312" width="880" height="56" rx="12"/>
  <text class="bt" x="84" y="336" font-size="12">Basis: Aufsicht — Prüfung durch die zuständige Behörde am Sitz des jeweiligen Betreibers</text>
  <text class="law" x="84" y="356">ANWENDBARES RECHT DER JURISDIKTION DES JEWEILIGEN BETREIBERS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Verantwortungsgrenzen: das Upstream-Open-Source-Projekt, der Instanzbetreiber als Verantwortlicher und Sie als betroffene Person">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .title { font: 600 17px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .body { font: 400 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #64748b; }
    .accent { fill: #2563eb; }
    .arrow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .foot { font: 400 12px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .card-accent { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .title { fill: #f1f5f9; }
      .body { fill: #94a3b8; }
      .tag { fill: #64748b; }
      .accent { fill: #60a5fa; }
      .arrow { stroke: #475569; }
      .foot { fill: #94a3b8; }
      .divider { stroke: #1e293b; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="470" rx="16"/>
  <rect class="card" x="60" y="52" width="270" height="130" rx="12"/>
  <text class="tag" x="84" y="80">UPSTREAM · MIT-LIZENZ</text>
  <text class="title" x="84" y="106">Open-Source-Projekt</text>
  <text class="body" x="84" y="130">Veröffentlicht nur Quellcode.</text>
  <text class="body" x="84" y="150">Betreibt keinen Maildienst,</text>
  <text class="body" x="84" y="170">keine Nutzerdaten, keine Telemetrie.</text>
  <rect class="card-accent" x="390" y="52" width="270" height="130" rx="12"/>
  <text class="tag accent" x="414" y="80">INSTANZ · VERANTWORTLICHER</text>
  <text class="title" x="414" y="106">Instanzbetreiber</text>
  <text class="body" x="414" y="130">Setzt auf ein eigenes Cloudflare-Konto</text>
  <text class="body" x="414" y="150">(Workers · D1 · KV · R2) und trägt die</text>
  <text class="body" x="414" y="170">Datenschutzpflichten: Information, Sicherheit, Aufsicht.</text>
  <rect class="card" x="720" y="52" width="220" height="130" rx="12"/>
  <text class="tag" x="744" y="80">BETROFFENE PERSON</text>
  <text class="title" x="744" y="106">Sie</text>
  <text class="body" x="744" y="130">Erstellen Sie ein Konto und</text>
  <text class="body" x="744" y="150">übergeben Ihre Postfächer und</text>
  <text class="body" x="744" y="170">Nachrichten an die Instanz.</text>
  <path class="arrow" d="M330,117 L382,117"/>
  <path class="arrow" d="M660,117 L712,117"/>
  <text class="foot" x="340" y="106">Code</text>
  <text class="foot" x="672" y="106">Vertrauen</text>
  <line class="divider" x1="60" y1="228" x2="940" y2="228"/>
  <rect class="card" x="60" y="262" width="880" height="150" rx="12"/>
  <text class="tag" x="84" y="290">WAS DAS BEDEUTET</text>
  <text class="title" x="84" y="318" font-size="15.5">Der Betreiber, bei dem Sie sich registrieren, ist Ihr Verantwortlicher — nicht die Upstream-Autoren.</text>
  <text class="body" x="84" y="344">• Gehostete Instanz mail.epocanvas.com: das EpoCanvas-Betriebsteam ist Verantwortlicher für Kontodaten und Sicherheitsprotokolle.</text>
  <text class="body" x="84" y="366">• Selbst gehostete Instanz: der Betreiber wird mit der Bereitstellung alleiniger und ausschließlicher Verantwortlicher.</text>
  <text class="body" x="84" y="388">• Alle Rechtstexte dieser Website gelten je Instanz; der Vertrag kommt mit dem Betreiber Ihrer Instanz zustande.</text>
</svg>

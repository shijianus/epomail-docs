<svg width="416" height="276" viewBox="0 0 416 276" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EpoCanvas Mail Security and Trust Illustration">
  <style>
    .bg-plate { fill: #F8F9FA; }
    .stroke-main { stroke: #1F1F1F; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-sub { stroke: #1F1F1F; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .fill-white { fill: #FFFFFF; }
    .fill-blue-main { fill: #1967D2; }
    .fill-blue-dark { fill: #185ABC; }
    .fill-blue-light { fill: #E8F0FE; }
    .fill-yellow { fill: #FCBD00; }
    .fill-green { fill: #34A853; }
    .fill-red { fill: #EA4335; }
    .fill-gray { fill: #E1E3E1; }
    @media (prefers-color-scheme: dark) {
      .bg-plate { fill: #131B2E; }
      .fill-white { fill: #1E293B; }
      .stroke-main { stroke: #E2E8F0; }
      .stroke-sub { stroke: #CBD5E1; }
      .fill-blue-light { fill: rgba(25, 103, 210, 0.25); }
      .fill-gray { fill: #334155; }
    }
  </style>

  <!-- Background Card -->
  <rect class="bg-plate" width="416" height="276" rx="28"/>

  <!-- Grounding Baseline -->
  <path class="stroke-main" d="M56 218 H360"/>

  <!-- Left: Smartphone Device Silhouette -->
  <rect class="fill-white stroke-main" x="80" y="88" width="76" height="130" rx="14"/>
  <rect class="fill-blue-light stroke-sub" x="88" y="104" width="60" height="96" rx="8"/>
  <circle cx="118" cy="96" r="2.5" class="stroke-sub" fill="#1F1F1F"/>
  <!-- Chat/Mail Bubble on Phone Screen -->
  <rect class="fill-white stroke-sub" x="95" y="118" width="46" height="24" rx="6"/>
  <path class="stroke-sub" d="M102 126 H134 M102 132 H124"/>
  <!-- Verified Badge on Phone -->
  <circle cx="118" cy="168" r="14" class="fill-green stroke-sub"/>
  <path class="stroke-main" d="M112 168 L116 172 L125 163" stroke="#FFFFFF"/>

  <!-- Centerpiece: EpoCanvas Security Shield -->
  <g transform="translate(162, 54)">
    <!-- Base Shield Shape -->
    <path class="stroke-main" d="M46 16 L84 28 C84 76 64 116 46 132 C28 116 8 76 8 28 Z" fill="#1967D2"/>
    <!-- Dimensional Half Shading -->
    <path d="M46 16 L84 28 C84 76 64 116 46 132 V16 Z" class="fill-blue-dark"/>
    <!-- Shield Outline Overlay -->
    <path class="stroke-main" d="M46 16 L84 28 C84 76 64 116 46 132 C28 116 8 76 8 28 Z" fill="none"/>
    <!-- Golden Keyhole on Shield -->
    <circle cx="46" cy="62" r="10" class="fill-yellow stroke-sub"/>
    <path class="stroke-sub fill-yellow" d="M42 66 L50 66 L52 82 L40 82 Z"/>
  </g>

  <!-- Right: Secure Postal Envelope with Document -->
  <g transform="translate(236, 102)">
    <!-- Emerging Document Paper -->
    <rect class="fill-white stroke-main" x="18" y="-18" width="70" height="74" rx="6"/>
    <path class="stroke-sub" d="M28 -4 H76 M28 6 H76 M28 16 H60"/>
    <circle cx="72" cy="38" r="8" class="fill-red"/>
    <!-- Envelope Body -->
    <path class="fill-blue-light stroke-main" d="M4 18 L53 60 L102 18 V116 H4 Z"/>
    <!-- Envelope Flap Fold Lines -->
    <path class="stroke-main" d="M4 18 L53 60 L102 18"/>
    <path class="stroke-sub" d="M4 116 L44 68 M102 116 L62 68"/>
  </g>

  <!-- Golden Brass Lock Beside Base -->
  <g transform="translate(144, 168)">
    <rect class="fill-yellow stroke-main" x="0" y="16" width="38" height="34" rx="6"/>
    <path class="stroke-main" d="M9 16 V8 C9 2.5 29 2.5 29 8 V16" fill="none"/>
    <circle cx="19" cy="31" r="3" class="stroke-sub" fill="#1F1F1F"/>
    <path class="stroke-sub" d="M19 34 V41"/>
  </g>

  <!-- Sparkles and Whimsical Line Accents -->
  <!-- Top Left Sparkle -->
  <path class="stroke-sub" d="M72 58 Q72 68 82 68 Q72 68 72 78 Q72 68 62 68 Q72 68 72 58Z" fill="#1F1F1F"/>
  <!-- Top Right Sparkle -->
  <path class="stroke-sub" d="M336 62 Q336 70 344 70 Q336 70 336 78 Q336 70 328 70 Q336 70 336 62Z" fill="#1F1F1F"/>
  <!-- Middle Ribbon Loops -->
  <path class="stroke-sub" d="M136 74 C152 64 162 82 152 92" fill="none"/>
  <path class="stroke-sub" d="M260 84 C272 70 286 86 276 96" fill="none"/>
</svg>

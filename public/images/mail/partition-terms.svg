<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="EpoCanvas Mail Terms of Service and Non-Commercial Governance">
  <style>
    .bg { fill: #f8fafc; }
    .col { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .col-highlight { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .ht { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .body { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #64748b; line-height: 1.5; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; }
    .pill-accent { fill: #dbeafe; stroke: #bfdbfe; }
    .pill-txt { font: 700 10px -apple-system, sans-serif; letter-spacing: 0.8px; fill: #475569; }
    .pill-txt-accent { font: 700 10px -apple-system, sans-serif; letter-spacing: 0.8px; fill: #1d4ed8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .col { fill: #111827; stroke: #1e293b; }
      .col-highlight { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .ht { fill: #f1f5f9; }
      .body { fill: #94a3b8; }
      .pill { fill: #1e293b; stroke: #334155; }
      .pill-accent { fill: rgba(30,64,175,0.3); stroke: #1e3a8a; }
      .pill-txt { fill: #94a3b8; }
      .pill-txt-accent { fill: #93c5fd; }
    }
  </style>
  <rect class="bg" width="1000" height="240" rx="16"/>

  <!-- Column 1: Non-Commercial Character -->
  <rect class="col-highlight" x="40" y="30" width="290" height="180" rx="12"/>
  <rect class="pill-accent" x="60" y="50" width="140" height="20" rx="4"/>
  <text class="pill-txt-accent" x="70" y="64">PROJECT CHARTER</text>
  <text class="ht" x="60" y="95">Non-Commercial Open Source</text>
  <text class="body" x="60" y="120">Built purely for personal, community,</text>
  <text class="body" x="60" y="140">and self-hosted communication.</text>
  <text class="body" x="60" y="160">Not operated as a commercial SaaS</text>
  <text class="body" x="60" y="180" font-weight="600" fill="#2563eb">No commercial profit intent</text>

  <!-- Column 2: Warranty & SLA Waiver -->
  <rect class="col" x="355" y="30" width="290" height="180" rx="12"/>
  <rect class="pill" x="375" y="50" width="130" height="20" rx="4"/>
  <text class="pill-txt" x="385" y="64">SERVICE LEVEL</text>
  <text class="ht" x="375" y="95">As-Is Service Provision</text>
  <text class="body" x="375" y="120">Maintained on a best-effort basis.</text>
  <text class="body" x="375" y="140">No enterprise SLAs, no compensation</text>
  <text class="body" x="375" y="160">for interruptions or scheduled outages.</text>
  <text class="body" x="375" y="180" font-weight="600" fill="#3b82f6">Voluntary community maintenance</text>

  <!-- Column 3: Mutual Responsibility -->
  <rect class="col" x="670" y="30" width="290" height="180" rx="12"/>
  <rect class="pill" x="690" y="50" width="130" height="20" rx="4"/>
  <text class="pill-txt" x="700" y="64">RESPONSIBILITY</text>
  <text class="ht" x="690" y="95">Equitable Conduct Boundaries</text>
  <text class="body" x="690" y="120">Users protect their own credentials.</text>
  <text class="body" x="690" y="140">Prohibition against mass marketing, spam,</text>
  <text class="body" x="690" y="160">or abusive automated scraping.</text>
  <text class="body" x="690" y="180" font-weight="600" fill="#3b82f6">Zero-tolerance abuse policy</text>
</svg>

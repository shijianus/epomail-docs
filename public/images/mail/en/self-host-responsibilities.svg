<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Source authors, instance operators and users: roles and duties follow actual processing activities.">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .card-accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .title { font: 600 17px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .body { font: 400 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #64748b; }
    .accent { fill: #2563eb; }
    .arrow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .foot { font: 400 12px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .card-accent { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .title { fill: #f1f5f9; }
      .body { fill: #94a3b8; }
      .tag { fill: #64748b; }
      .accent { fill: #60a5fa; }
      .arrow { stroke: #475569; }
      .foot { fill: #94a3b8; }
      .divider { stroke: #1e293b; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="470" rx="16"/>
  <rect class="card" x="60" y="52" width="270" height="130" rx="12"/>
  <text class="tag" x="84" y="80">SOURCE · MIT</text>
  <text class="title" x="84" y="106">Source authors</text>
  <text class="body" x="84" y="130">Publish code &amp; patches</text>
  <text class="body" x="84" y="150">Roles depend on actual activity</text>
  <text class="body" x="84" y="170">Operating brings duties</text>
  <rect class="card-accent" x="390" y="52" width="270" height="130" rx="12"/>
  <text class="tag accent" x="414" y="80">INSTANCE</text>
  <text class="title" x="414" y="106">Instance operator</text>
  <text class="body" x="414" y="130">Determines deployment &amp; access</text>
  <text class="body" x="414" y="150">Assess each processing activity</text>
  <text class="body" x="414" y="170">Publish notices &amp; safeguards</text>
  <rect class="card" x="720" y="52" width="220" height="130" rx="12"/>
  <text class="tag" x="744" y="80">PEOPLE</text>
  <text class="title" x="744" y="106">Users &amp; contacts</text>
  <text class="body" x="744" y="130">Users, senders &amp; recipients</text>
  <text class="body" x="744" y="150">Rights follow the processing</text>
  <text class="body" x="744" y="170">Contact the actual operator</text>
  <path class="arrow" d="M330,117 L382,117"/>
  <path class="arrow" d="M660,117 L712,117"/>
  <text class="foot" x="340" y="106">code</text>
  <text class="foot" x="672" y="106">use</text>
  <line class="divider" x1="60" y1="228" x2="940" y2="228"/>
  <rect class="card" x="60" y="262" width="880" height="150" rx="12"/>
  <text class="tag" x="84" y="290">ROLES &amp; DUTIES</text>
  <text class="title" x="84" y="318" font-size="15.5">Roles follow purposes, means &amp; actual activity</text>
  <text class="body" x="84" y="344">Hosted: identify the actual operator and the processing it controls.</text>
  <text class="body" x="84" y="366">Self-hosted: assess controller, joint-controller and processor roles for each activity.</text>
  <text class="body" x="84" y="388">Code authors who also operate or decide processing remain responsible for that activity.</text>
</svg>

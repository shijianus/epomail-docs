<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" role="img" aria-label="Glossary map: legal terms and technical terms defined once and used across all documents">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .c1 { fill: #eff6ff; stroke: #2563eb; }
    .c2 { fill: #f0fdf4; stroke: #16a34a; }
    .row { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .t { font: 600 13px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .b { font: 400 11px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .bt { font: 600 13.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #64748b; }
    .hub { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .hub-t { font: 600 12.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #1d4ed8; }
    .hub-b { font: 400 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .link { stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .c1 { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .c2 { fill: rgba(22,163,74,0.12); stroke: #4ade80; }
      .row { fill: #0b0f19; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .bt { fill: #f1f5f9; }
      .tag { fill: #64748b; }
      .hub { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .hub-t { fill: #93c5fd; }
      .hub-b { fill: #94a3b8; }
      .link { stroke: #60a5fa; }
    }
  </style>
  <rect class="bg" width="1000" height="400" rx="16"/>
  <text class="tag" x="60" y="46">GLOSSARY MAP — KEY TERMS</text>
  <rect class="c1" x="60" y="66" width="330" height="230" rx="12"/>
  <text class="bt" x="84" y="96">Legal terms</text>
  <rect class="row" x="80" y="112" width="290" height="36" rx="8"/>
  <text class="t" x="94" y="135" font-size="12">Data controller · Processor</text>
  <rect class="row" x="80" y="156" width="290" height="36" rx="8"/>
  <text class="t" x="94" y="179" font-size="12">Data subject · Specific purpose</text>
  <rect class="row" x="80" y="200" width="290" height="36" rx="8"/>
  <text class="t" x="94" y="223" font-size="12">International transfer</text>
  <rect class="row" x="80" y="244" width="290" height="36" rx="8"/>
  <text class="t" x="94" y="267" font-size="12">Notification duty · Marketing refusal</text>
  <rect class="c2" x="610" y="66" width="330" height="230" rx="12"/>
  <text class="bt" x="634" y="96">Technical terms</text>
  <rect class="row" x="630" y="112" width="290" height="36" rx="8"/>
  <text class="t" x="644" y="135" font-size="12">Instance · Operator</text>
  <rect class="row" x="630" y="156" width="290" height="36" rx="8"/>
  <text class="t" x="644" y="179" font-size="12">D1 · KV · R2 · BYOS</text>
  <rect class="row" x="630" y="200" width="290" height="36" rx="8"/>
  <text class="t" x="644" y="223" font-size="12">Encryption at rest · JWT · RBAC</text>
  <rect class="row" x="630" y="244" width="290" height="36" rx="8"/>
  <text class="t" x="644" y="267" font-size="12">Zero telemetry · Soft / physical deletion</text>
  <circle class="hub" cx="500" cy="181" r="86"/>
  <text class="hub-t" x="500" y="172" text-anchor="middle">DEFINED HERE</text>
  <text class="hub-b" x="500" y="192" text-anchor="middle">used consistently</text>
  <text class="hub-b" x="500" y="208" text-anchor="middle">across all documents</text>
  <path class="link" d="M392,181 L414,181"/>
  <path class="link" d="M586,181 L608,181"/>
  <text class="tag" x="60" y="330">INTERPRETATION</text>
  <rect class="card" x="60" y="342" width="880" height="40" rx="10"/>
  <text class="b" x="84" y="360">Legal terms follow general data-protection usage; technical terms follow the actual open-source implementation.</text>
  <text class="b" x="84" y="376">Unlisted terms are read in the context of the Privacy Policy and the Terms of Service.</text>
</svg>

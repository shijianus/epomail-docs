<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img" aria-label="EpoCanvas Mail Anti-Tampering &amp; Official Integrity Verification Architecture: Edge Sender Authentication, Immutable Delivery Pipeline, Client Shadow DOM Sandbox, and Verifiable SHA-256 Digest">
  <style>
    .bg { fill: #f8fafc; }
    .band { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .box-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
    .lbl-blue { font: 700 11px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #2563eb; letter-spacing: 1.4px; }
    .lbl-green { font: 700 11px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #16a34a; letter-spacing: 1.4px; }
    .lbl-amber { font: 700 11px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #d97706; letter-spacing: 1.4px; }
    .t { font: 600 14px -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
    .b { font: 400 11.5px -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #64748b; }
    .chip { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .chip-t { font: 600 10.5px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #334155; }
    .arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#pa); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .band { fill: #111827; stroke: #1e293b; }
      .box { fill: #111827; stroke: #1e293b; }
      .box-blue { fill: rgba(59,130,246,0.12); stroke: #3b82f6; }
      .box-green { fill: rgba(34,197,94,0.12); stroke: #22c55e; }
      .box-amber { fill: rgba(245,158,11,0.12); stroke: #f59e0b; }
      .lbl-blue { fill: #60a5fa; }
      .lbl-green { fill: #4ade80; }
      .lbl-amber { fill: #fbbf24; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .chip { fill: #1e293b; stroke: #334155; }
      .chip-t { fill: #94a3b8; }
      .arrow { stroke: #475569; }
    }
  </style>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="480" rx="16"/>

  <!-- Tier 1: Authoritative Sender & Edge Gatekeeper -->
  <rect class="band" x="40" y="35" width="920" height="110" rx="14"/>
  <text class="lbl-blue" x="60" y="58">TIER 1 · 边缘发件人防伪鉴权与特权通道 (EDGE IDENTITY LOCK)</text>
  
  <rect class="box-blue" x="60" y="70" width="270" height="60" rx="10"/>
  <text class="t" x="78" y="93">官方权威发件人锁定</text>
  <text class="b" x="78" y="112">announcement@epocanvas.com</text>

  <rect class="box" x="355" y="70" width="270" height="60" rx="10"/>
  <text class="t" x="373" y="93">边缘冒充阻断 (Anti-Spoofing)</text>
  <text class="b" x="373" y="112">外部发件人与非特权接口严禁伪造 (403)</text>

  <rect class="box-green" x="650" y="70" width="290" height="60" rx="10"/>
  <text class="t" x="668" y="93">权威认证标记 (isOfficial: 1)</text>
  <text class="b" x="668" y="112">Edge Worker 内部密钥签名，蓝标防伪</text>

  <path class="arrow" d="M195,145 L195,185"/>
  <path class="arrow" d="M490,145 L490,185"/>
  <path class="arrow" d="M795,145 L795,185"/>

  <!-- Tier 2: Immutable Delivery Pipeline & Cryptographic Storage -->
  <rect class="band" x="40" y="190" width="920" height="115" rx="14"/>
  <text class="lbl-amber" x="60" y="213">TIER 2 · 不可变投递与存储防篡改 (IMMUTABLE SNAPSHOT &amp; AES-GCM)</text>

  <rect class="box" x="60" y="225" width="270" height="64" rx="10"/>
  <text class="t" x="78" y="249">不可变快照投递 (Immutable)</text>
  <text class="b" x="78" y="268">与收件人语言解耦，正文发布即固化</text>

  <rect class="box-amber" x="355" y="225" width="270" height="64" rx="10"/>
  <text class="t" x="373" y="249">环境指纹证据链 (Fingerprint)</text>
  <text class="b" x="373" y="268">IP · Geo 城市 · ASN 提供商 · 1h 静默窗口</text>

  <rect class="box" x="650" y="225" width="290" height="64" rx="10"/>
  <text class="t" x="668" y="249">静态加密与生命周期存证</text>
  <text class="b" x="668" y="268">AES-256-GCM 加密，安全日志物理审计</text>

  <path class="arrow" d="M195,305 L195,345"/>
  <path class="arrow" d="M490,305 L490,345"/>
  <path class="arrow" d="M795,305 L795,345"/>

  <!-- Tier 3: Client Sandbox & Live Verification -->
  <rect class="band" x="40" y="350" width="920" height="105" rx="14"/>
  <text class="lbl-green" x="60" y="373">TIER 3 · 客户端沙箱物理隔离与动态防篡改校验 (SANDBOX &amp; SHA-256 PROOF)</text>

  <rect class="box-green" x="60" y="383" width="270" height="58" rx="10"/>
  <text class="t" x="78" y="405">Shadow DOM 物理沙箱</text>
  <text class="b" x="78" y="423">DOMPurify 白名单净化，阻断脚本注入</text>

  <rect class="box" x="355" y="383" width="270" height="58" rx="10"/>
  <text class="t" x="373" y="405">双向操作安全处置卡片</text>
  <text class="b" x="373" y="423">本人操作无忧 vs 非本人操作应急通道</text>

  <rect class="box-blue" x="650" y="383" width="290" height="58" rx="10"/>
  <text class="t" x="668" y="405">实时防篡改验真 (Web Crypto)</text>
  <text class="b" x="668" y="423">SHA-256 内容哈希 + Git Commit 签名核验</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" role="img" aria-label="EpoCanvas Mail Four-Tier Defense-in-Depth Security Model: Layer 1 Edge Gateway, Layer 2 FIDO2 WebAuthn Passkeys, Layer 3 AES-256-GCM At-Rest Encryption, and Layer 4 Client Sandbox &amp; Cryptographic Manifest">
  <defs>
    <linearGradient id="shieldGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="shieldGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: url(#cardShadow); }
    .card-accent { fill: url(#shieldGradLight); stroke: #2563eb; stroke-width: 1.8; filter: url(#cardShadow); }
    .title-main { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .layer-tag { font: 700 10.5px -apple-system, BlinkMacSystemFont, sans-serif; fill: #1d4ed8; letter-spacing: 1px; }
    .layer-title { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .layer-body { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #475569; line-height: 1.55; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .pill-accent { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
    .pill-txt { font: 600 10.5px ui-monospace, SFMono-Regular, monospace; fill: #1e293b; }
    .pill-accent-txt { font: 700 10.5px -apple-system, sans-serif; fill: #1d4ed8; }
    .connector { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 4 4; fill: none; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .card-accent { fill: url(#shieldGradDark); stroke: #3b82f6; }
      .title-main { fill: #f8fafc; }
      .layer-tag { fill: #93c5fd; }
      .layer-title { fill: #f1f5f9; }
      .layer-body { fill: #94a3b8; }
      .pill { fill: #1e293b; stroke: #334155; }
      .pill-accent { fill: rgba(37,99,235,0.25); stroke: #2563eb; }
      .pill-txt { fill: #e2e8f0; }
      .pill-accent-txt { fill: #93c5fd; }
      .connector { stroke: #475569; }
    }
  </style>

  <!-- Background Canvas -->
  <rect class="bg" width="1000" height="480" rx="16"/>

  <!-- Top Header -->
  <text class="title-main" x="40" y="44">EpoCanvas Mail · 纵深防御技术架构与密码学标准 (Defense-in-Depth)</text>
  <rect class="pill-accent" x="690" y="27" width="270" height="24" rx="12"/>
  <text class="pill-accent-txt" x="704" y="43">4-TIER MULTI-LAYER HARDENING</text>

  <!-- 4 Columns for the 4 Defensive Layers -->
  <!-- Layer 1: Edge &amp; WAF -->
  <g transform="translate(40, 75)">
    <rect class="card" width="215" height="365" rx="12"/>
    <rect class="pill-accent" x="16" y="16" width="115" height="22" rx="6"/>
    <text class="layer-tag" x="24" y="31">TIER 1 · NETWORK</text>
    <text class="layer-title" x="16" y="65">边缘网关与反滥用</text>
    <text class="layer-body" x="16" y="92">• Anycast 边缘网络吸收并清洗全球 DDoS 攻击</text>
    <text class="layer-body" x="16" y="132">• 全站强制 TLS 1.3 传输加密与 HSTS 预加载</text>
    <text class="layer-body" x="16" y="172">• 严格阻断私网 (RFC 1918) 与元数据 SSRF 请求</text>
    <text class="layer-body" x="16" y="212">• 边缘层硬编码阻断官方系统邮件仿冒冒充</text>
    <text class="layer-body" x="16" y="252">• 固定窗口限流计数器抵抗接口爆破与探测</text>
    
    <rect class="pill" x="16" y="310" width="183" height="38" rx="6"/>
    <text class="pill-txt" x="26" y="326">Cloudflare Edge WAF</text>
    <text class="layer-tag" x="26" y="340">ANTI-DDoS · TLS 1.3</text>
  </g>

  <!-- Layer 2: Auth &amp; Passkeys -->
  <g transform="translate(275, 75)">
    <rect class="card" width="215" height="365" rx="12"/>
    <rect class="pill-accent" x="16" y="16" width="105" height="22" rx="6"/>
    <text class="layer-tag" x="24" y="31">TIER 2 · ACCESS</text>
    <text class="layer-title" x="16" y="65">抗钓鱼强身份认证</text>
    <text class="layer-body" x="16" y="92">• 深度集成 FIDO2 / WebAuthn 无密码通行密钥</text>
    <text class="layer-body" x="16" y="132">• 凭据密码学绑定域名，杜绝中间人假站钓鱼</text>
    <text class="layer-body" x="16" y="172">• 私钥永驻设备安全芯片 (Secure Enclave)</text>
    <text class="layer-body" x="16" y="212">• PBKDF2 (100,000 次加盐) 抵抗离线彩虹表</text>
    <text class="layer-body" x="16" y="252">• 维护 15 处已知环境指纹，防疲劳静默降噪</text>

    <rect class="pill" x="16" y="310" width="183" height="38" rx="6"/>
    <text class="pill-txt" x="26" y="326">FIDO2 / WebAuthn</text>
    <text class="layer-tag" x="26" y="340">HARDWARE ENCLAVE</text>
  </g>

  <!-- Layer 3: At-Rest Encryption -->
  <g transform="translate(510, 75)">
    <rect class="card-accent" width="215" height="365" rx="12"/>
    <rect class="pill-accent" x="16" y="16" width="110" height="22" rx="6"/>
    <text class="layer-tag" x="24" y="31">TIER 3 · STORAGE</text>
    <text class="layer-title" x="16" y="65">静态认证加密隔离</text>
    <text class="layer-body" x="16" y="92">• 工业级 AES-256-GCM 对称认证信封加密</text>
    <text class="layer-body" x="16" y="132">• 邮件正文写入 D1 前独立派生密文与 Auth Tag</text>
    <text class="layer-body" x="16" y="172">• 防范数据库快照窃取、脱机脱库与越权分析</text>
    <text class="layer-body" x="16" y="212">• 密钥由环境变量安全注入，与数据物理隔离</text>
    <text class="layer-body" x="16" y="252">• 严格遵循 Fail-Closed (默认拒绝) 鉴权准则</text>

    <rect class="pill" x="16" y="310" width="183" height="38" rx="6"/>
    <text class="pill-txt" x="26" y="326">AES-256-GCM Envelope</text>
    <text class="layer-tag" x="26" y="340">SECRET ISOLATION</text>
  </g>

  <!-- Layer 4: Client Sandbox &amp; Integrity -->
  <g transform="translate(745, 75)">
    <rect class="card" width="215" height="365" rx="12"/>
    <rect class="pill-accent" x="16" y="16" width="115" height="22" rx="6"/>
    <text class="layer-tag" x="24" y="31">TIER 4 · RUNTIME</text>
    <text class="layer-title" x="16" y="65">客户端沙箱与存证</text>
    <text class="layer-body" x="16" y="92">• 自封闭 Shadow DOM 隔离渲染复杂 HTML 邮件</text>
    <text class="layer-body" x="16" y="132">• DOMPurify 严苛白名单剥离 Script/Style/Iframe</text>
    <text class="layer-body" x="16" y="172">• 阻断 XSS、会话窃取与宿主界面伪造攻击</text>
    <text class="layer-body" x="16" y="212">• 官方文档全网 SHA-256 清单公开透明存证</text>
    <text class="layer-body" x="16" y="252">• 浏览器内嵌 Web Crypto API 实时比对验真</text>

    <rect class="pill" x="16" y="310" width="183" height="38" rx="6"/>
    <text class="pill-txt" x="26" y="326">Shadow DOM + SHA-256</text>
    <text class="layer-tag" x="26" y="340">IMMUTABLE SANDBOX</text>
  </g>

</svg>

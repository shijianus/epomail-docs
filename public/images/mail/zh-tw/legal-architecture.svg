<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" role="img" aria-label="法律文件架構：服務條款為契約層，隱私權政策與可接受使用政策為政策層，資料處理與第三方處理者為支撐文件，立於適用法律與安全維護義務之上">
  <style>
    .bg { fill: #f8fafc; }
    .layer { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .top { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .t { font: 600 15px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .b { font: 400 11.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .tag { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1.2px; fill: #2563eb; }
    .law { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #475569; }
    .vline { stroke: #cbd5e1; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .layer { fill: #111827; stroke: #1e293b; }
      .top { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .base { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .law { fill: #94a3b8; }
      .vline { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="1000" height="430" rx="16"/>
  <rect class="top" x="250" y="46" width="500" height="86" rx="12"/>
  <text class="tag" x="274" y="72">契約層</text>
  <text class="t" x="274" y="94">服務條款</text>
  <text class="b" x="274" y="110">電子同意：與書面簽署同等效力</text>
  <text class="b" x="274" y="126">全文公開供審閱 · 修訂隨開源儲存庫存檔</text>
  <line class="vline" x1="360" y1="132" x2="360" y2="168"/>
  <line class="vline" x1="500" y1="132" x2="500" y2="168"/>
  <line class="vline" x1="640" y1="132" x2="640" y2="168"/>
  <rect class="layer" x="70" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="90" y="194" font-size="13">隱私權政策</text>
  <text class="b" x="90" y="214">收集內容與目的 · 處理標準</text>
  <rect class="layer" x="380" y="168" width="240" height="66" rx="12"/>
  <text class="t" x="400" y="194" font-size="13">可接受使用政策</text>
  <text class="b" x="400" y="214">行為邊界與執行</text>
  <rect class="layer" x="640" y="168" width="290" height="66" rx="12"/>
  <text class="t" x="660" y="194" font-size="13">資料處理與安全 · 第三方處理者</text>
  <text class="b" x="660" y="214">安全維護措施 · 處理者清單</text>
  <rect class="base" x="70" y="266" width="860" height="100" rx="12"/>
  <text class="tag" x="94" y="292">準據框架</text>
  <text class="t" x="94" y="316" font-size="13.5">準據法為營運者所在地之法律：託管實例適用臺灣法律、臺北地方法院</text>
  <text class="b" x="94" y="336">顯失公平之定式條款依適用法律不受拘束</text>
  <text class="b" x="94" y="352">適用法律不得排除之責任不因責任上限而受限</text>
  <text class="law" x="94" y="400">效力順序：主題文件優先 · 繁體中文（臺灣）版為正式版本</text>
</svg>

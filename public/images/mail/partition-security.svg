<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-label="EpoCanvas Mail Data Processing and Infrastructure Security Defense">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .box-shield { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .lbl { font: 700 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #64748b; line-height: 1.45; }
    .sec-tag { font: 700 10px -apple-system, sans-serif; letter-spacing: 1px; fill: #2563eb; }
    .sec-badge { fill: #dbeafe; stroke: #bfdbfe; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .box { fill: #111827; stroke: #1e293b; }
      .box-shield { fill: rgba(37,99,235,0.12); stroke: #3b82f6; }
      .lbl { fill: #f1f5f9; }
      .sub { fill: #94a3b8; }
      .sec-tag { fill: #60a5fa; }
      .sec-badge { fill: rgba(30,64,175,0.3); stroke: #1e3a8a; }
    }
  </style>
  <rect class="bg" width="1000" height="240" rx="16"/>

  <!-- Layer 1 -->
  <rect class="box" x="40" y="30" width="210" height="180" rx="12"/>
  <rect class="sec-badge" x="55" y="45" width="105" height="20" rx="4"/>
  <text class="sec-tag" x="65" y="59">LAYER 1 · EDGE</text>
  <text class="lbl" x="55" y="90">Edge Gateway</text>
  <text class="sub" x="55" y="115">Cloudflare Workers</text>
  <text class="sub" x="55" y="135">DDoS mitigation, TLS 1.3</text>
  <text class="sub" x="55" y="155">termination, and sender</text>
  <text class="sub" x="55" y="175">anti-spoofing enforcement.</text>

  <!-- Layer 2 -->
  <rect class="box" x="270" y="30" width="210" height="180" rx="12"/>
  <rect class="sec-badge" x="285" y="45" width="105" height="20" rx="4"/>
  <text class="sec-tag" x="295" y="59">LAYER 2 · AUTH</text>
  <text class="lbl" x="285" y="90">FIDO2 &amp; Passkeys</text>
  <text class="sub" x="285" y="115">Hardware-bound WebAuthn,</text>
  <text class="sub" x="285" y="135">TOTP RFC 6238, and</text>
  <text class="sub" x="285" y="155">32-byte opaque handle</text>
  <text class="sub" x="285" y="175">credential isolation.</text>

  <!-- Layer 3 -->
  <rect class="box" x="500" y="30" width="210" height="180" rx="12"/>
  <rect class="sec-badge" x="515" y="45" width="105" height="20" rx="4"/>
  <text class="sec-tag" x="525" y="59">LAYER 3 · CRYPTO</text>
  <text class="lbl" x="515" y="90">At-Rest Encryption</text>
  <text class="sub" x="515" y="115">AES-256-GCM message</text>
  <text class="sub" x="515" y="135">payload encryption,</text>
  <text class="sub" x="515" y="155">isolated instance DB,</text>
  <text class="sub" x="515" y="175">and zero telemetry.</text>

  <!-- Layer 4 -->
  <rect class="box-shield" x="730" y="30" width="230" height="180" rx="12"/>
  <rect class="sec-badge" x="745" y="45" width="125" height="20" rx="4"/>
  <text class="sec-tag" x="755" y="59">LAYER 4 · INTEGRITY</text>
  <text class="lbl" x="745" y="90">Tamper-Proof Audit</text>
  <text class="sub" x="745" y="115">Public SHA-256 manifest,</text>
  <text class="sub" x="745" y="135">Git Commit anchor,</text>
  <text class="sub" x="745" y="155">Shadow DOM client sandbox,</text>
  <text class="sub" x="745" y="175">and Web Crypto verification.</text>
</svg>

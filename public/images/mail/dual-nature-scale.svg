<svg width="416" height="276" viewBox="0 0 416 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="双轨治理示意：同一开源代码库，托管实例与自建实例各自的数据控制者与责任边界">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .hosted { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; }
    .self { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .chip { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .t { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #0f172a; }
    .b { font: 400 8px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #64748b; }
    .tag { font: 600 8px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1px; fill: #2563eb; }
    .tagg { font: 600 8px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; letter-spacing: 1px; fill: #475569; }
    .bt { font: 600 9px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans', sans-serif; fill: #334155; }
    .mid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .hosted { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .self { fill: #111827; stroke: #1e293b; }
      .base { fill: #111827; stroke: #1e293b; }
      .chip { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .tagg { fill: #94a3b8; }
      .bt { fill: #cbd5e1; }
      .mid { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="416" height="276" rx="16"/>
  <text class="tag" x="26" y="26">双轨治理</text>
  <rect class="chip" x="108" y="38" width="200" height="34" rx="10"/>
  <text class="t" x="208" y="53" text-anchor="middle" font-size="9.5">同一开源代码库（MIT）</text>
  <text class="b" x="208" y="66" text-anchor="middle">零遥测 · 不回传任何数据</text>
  <line class="mid" x1="208" y1="72" x2="208" y2="84"/>
  <line class="mid" x1="112" y1="84" x2="304" y2="84"/>
  <line class="mid" x1="112" y1="84" x2="112" y2="94"/>
  <line class="mid" x1="304" y1="84" x2="304" y2="94"/>
  <rect class="hosted" x="26" y="94" width="172" height="112" rx="10"/>
  <text class="tag" x="42" y="114">托管实例</text>
  <text class="t" x="42" y="132" font-size="9.5">mail.epocanvas.com</text>
  <text class="b" x="42" y="148">由 EpoCanvas 团队运营</text>
  <text class="b" x="42" y="162">运营者为数据控制者</text>
  <text class="b" x="42" y="176">非商业 · 台湾法域</text>
  <text class="b" x="42" y="190">直接适用本站条款</text>
  <rect class="self" x="218" y="94" width="172" height="112" rx="10"/>
  <text class="tagg" x="234" y="114">自建实例</text>
  <text class="t" x="234" y="132" font-size="9.5">您的域名 · 您的帐号</text>
  <text class="b" x="234" y="148">部署者为唯一数据控制者</text>
  <text class="b" x="234" y="162">运行于部署者的 Cloudflare</text>
  <text class="b" x="234" y="176">自订条款 · 自订法域</text>
  <text class="b" x="234" y="190">本站文档可作范本</text>
  <rect class="base" x="26" y="222" width="364" height="36" rx="10"/>
  <text class="bt" x="44" y="238">上游作者：</text>
  <text class="b" x="44" y="251">不运营邮件服务 · 不掌握用户资料 · 不为任何实例的运营担责</text>
</svg>

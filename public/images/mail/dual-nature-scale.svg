<svg width="416" height="276" viewBox="0 0 416 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dual-nature governance: one MIT-licensed codebase, two independent operation tracks with different data controllers">
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .hosted { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; }
    .self { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    .base { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .chip { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; }
    .t { font: 600 10.5px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', sans-serif; fill: #0f172a; }
    .b { font: 400 8px -apple-system, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', sans-serif; fill: #64748b; }
    .tag { font: 600 8px -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1px; fill: #2563eb; }
    .tagg { font: 600 8px -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1px; fill: #475569; }
    .bt { font: 600 9px -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #334155; }
    .mid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b0f19; }
      .card { fill: #111827; stroke: #1e293b; }
      .hosted { fill: rgba(59,130,246,0.10); stroke: #3b82f6; }
      .self { fill: #111827; stroke: #1e293b; }
      .base { fill: #111827; stroke: #1e293b; }
      .chip { fill: #111827; stroke: #1e293b; }
      .t { fill: #f1f5f9; }
      .b { fill: #94a3b8; }
      .tag { fill: #60a5fa; }
      .tagg { fill: #94a3b8; }
      .bt { fill: #cbd5e1; }
      .mid { stroke: #334155; }
    }
  </style>
  <rect class="bg" width="416" height="276" rx="16"/>

  <text class="tag" x="26" y="26">DUAL-NATURE GOVERNANCE</text>

  <rect class="chip" x="108" y="38" width="200" height="34" rx="10"/>
  <text class="t" x="208" y="53" text-anchor="middle" font-size="9.5">One open-source codebase (MIT)</text>
  <text class="b" x="208" y="66" text-anchor="middle">zero telemetry · nothing phones home</text>

  <line class="mid" x1="208" y1="72" x2="208" y2="84"/>
  <line class="mid" x1="112" y1="84" x2="304" y2="84"/>
  <line class="mid" x1="112" y1="84" x2="112" y2="94"/>
  <line class="mid" x1="304" y1="84" x2="304" y2="94"/>

  <rect class="hosted" x="26" y="94" width="172" height="112" rx="10"/>
  <text class="tag" x="42" y="114">HOSTED INSTANCE</text>
  <text class="t" x="42" y="132">mail.epocanvas.com</text>
  <text class="b" x="42" y="148">operated by the EpoCanvas team</text>
  <text class="b" x="42" y="162">operator is the data controller</text>
  <text class="b" x="42" y="176">non-commercial · Taiwan jurisdiction</text>
  <text class="b" x="42" y="190">terms of this site apply directly</text>

  <rect class="self" x="218" y="94" width="172" height="112" rx="10"/>
  <text class="tagg" x="234" y="114">SELF-HOSTED INSTANCE</text>
  <text class="t" x="234" y="132">your domain · your account</text>
  <text class="b" x="234" y="148">deployer is the sole data controller</text>
  <text class="b" x="234" y="162">runs on the deployer's Cloudflare</text>
  <text class="b" x="234" y="176">own terms · own jurisdiction</text>
  <text class="b" x="234" y="190">this site may serve as a template</text>

  <rect class="base" x="26" y="222" width="364" height="36" rx="10"/>
  <text class="bt" x="44" y="238">Upstream authors:</text>
  <text class="b" x="44" y="251">run no e-mail service · hold no user data · bear no liability for any instance's operation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="40" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    EpoCanvas Mail • Data Privacy &amp; Governance Lifecycle
  </text>
  <text x="40" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Continuous Privacy Protection from Ingestion to Cascading Physical Deletion (GDPR Art. 17 &amp; CCPA Compliant)
  </text>

  <!-- Flow Arrows connecting stages -->
  <path d="M 245 220 L 275 220" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <polygon points="275,215 285,220 275,225" fill="#64748b"/>

  <path d="M 485 220 L 515 220" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <polygon points="515,215 525,220 515,225" fill="#64748b"/>

  <path d="M 725 220 L 755 220" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
  <polygon points="755,215 765,220 755,225" fill="#64748b"/>

  <!-- Step 1: Encrypted Ingestion -->
  <g transform="translate(40, 110)" filter="url(#cardShadow)">
    <rect width="205" height="250" rx="12" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#1d4ed8" fill-opacity="0.5"/>
    <text x="36" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle">1</text>
    <text x="66" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Ingestion</text>
    <line x1="20" y1="70" x2="185" y2="70" stroke="#1e40af" stroke-width="1"/>
    
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">• Inbound MX Routing</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">SPF / DKIM / DMARC verify</text>
    
    <text x="20" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">• Mandatory TLS 1.3</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#cbd5e1">Zero cleartext transit</text>
    
    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">• Turnstile Protection</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#cbd5e1">Anti-bot &amp; brute-force filter</text>
  </g>

  <!-- Step 2: Edge-Confined Execution -->
  <g transform="translate(280, 110)" filter="url(#cardShadow)">
    <rect width="205" height="250" rx="12" fill="url(#greenCard)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#047857" fill-opacity="0.5"/>
    <text x="36" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">2</text>
    <text x="66" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Edge Runtime</text>
    <line x1="20" y1="70" x2="185" y2="70" stroke="#065f46" stroke-width="1"/>
    
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">• Stateless Stream Parsing</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">No persistent server VMs</text>
    
    <text x="20" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">• In-Memory Workers AI</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#cbd5e1">Instant OTP code extraction</text>
    
    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">• Zero Model Training</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#cbd5e1">Air-gapped from public LLMs</text>
  </g>

  <!-- Step 3: Sovereign Storage -->
  <g transform="translate(520, 110)" filter="url(#cardShadow)">
    <rect width="205" height="250" rx="12" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#b45309" fill-opacity="0.5"/>
    <text x="36" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">3</text>
    <text x="66" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Storage Guard</text>
    <line x1="20" y1="70" x2="185" y2="70" stroke="#92400e" stroke-width="1"/>
    
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="600" fill="#fde68a">• Structured Relational D1</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">PBKDF2 passwords, AES-GCM</text>
    
    <text x="20" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#fde68a">• R2 Object Attachments</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#cbd5e1">Encrypted blobs at rest</text>
    
    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#fde68a">• 2% Quota Safeguard</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#cbd5e1">552 fail-closed protection</text>
  </g>

  <!-- Step 4: Cascading Erasure -->
  <g transform="translate(760, 110)" filter="url(#cardShadow)">
    <rect width="200" height="250" rx="12" fill="url(#purpleCard)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="#7e22ce" fill-opacity="0.5"/>
    <text x="36" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">4</text>
    <text x="66" y="42" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Erasure</text>
    <line x1="20" y1="70" x2="180" y2="70" stroke="#6b21a8" stroke-width="1"/>
    
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">• Atomic Physical Purge</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">D1 SQL atomic deletion</text>
    
    <text x="20" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">• R2 Object Shredding</text>
    <text x="20" y="165" font-family="sans-serif" font-size="11" fill="#cbd5e1">Zero orphaned binary blobs</text>
    
    <text x="20" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">• Millisecond KV Wipe</text>
    <text x="20" y="215" font-family="sans-serif" font-size="11" fill="#cbd5e1">Tokens &amp; session revocation</text>
  </g>

  <!-- Footer Tagline -->
  <text x="500" y="395" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Designed for Mathematical Data Sovereignty • Zero Behavioral Advertising • 100% User Asset Ownership
  </text>
</svg>

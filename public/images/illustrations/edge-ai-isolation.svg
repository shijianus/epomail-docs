<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="edgeZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="forbiddenZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#aiBg)" stroke="#374151" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f9fafb">
    Edge-Confined AI Inference &amp; Air-Gapped Model Training Exclusion
  </text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#9ca3af">
    Strict Compliance with Privacy Policy Section 15 &amp; Technical Baseline Specification v1.0.0
  </text>

  <!-- Left Side: Edge Processing Zone -->
  <g transform="translate(40, 100)">
    <rect width="460" height="260" rx="12" fill="url(#edgeZone)" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#34d399">
      ✓ EDGE CONFINED COMPUTE ZONE (Cloudflare Workers)
    </text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#a7f3d0">
      Ephemeral, In-Memory Processing Directly Nearest to the User
    </text>

    <!-- Node 1: Inbound Email -->
    <rect x="25" y="80" width="180" height="60" rx="8" fill="#065f46" stroke="#059669" stroke-width="1"/>
    <text x="35" y="105" font-family="sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Inbound Stream</text>
    <text x="35" y="125" font-family="sans-serif" font-size="11" fill="#a7f3d0">RFC 822 MIME parser</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 205 110 L 255 110" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="255,106 265,110 255,114" fill="#34d399"/>

    <!-- Node 2: Workers AI (Local GPU) -->
    <rect x="265" y="80" width="170" height="60" rx="8" fill="#047857" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="275" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Workers AI Chip</text>
    <text x="275" y="125" font-family="sans-serif" font-size="11" fill="#6ee7b7">Edge GPU Model</text>

    <!-- Arrow down to Node 3 -->
    <path d="M 350 140 L 350 175" stroke="#34d399" stroke-width="2"/>
    <polygon points="346,175 350,185 354,175" fill="#34d399"/>

    <!-- Node 3: Result & Immediate Purge -->
    <rect x="25" y="185" width="410" height="55" rx="8" fill="#022c22" stroke="#047857" stroke-width="1"/>
    <text x="40" y="208" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">
      Output: OTP Verification Code Extracted
    </text>
    <text x="40" y="226" font-family="sans-serif" font-size="11" fill="#9ca3af">
      ⚡ Memory buffer immediately unallocated &amp; destroyed. 0 data persisted in AI logs.
    </text>
  </g>

  <!-- Middle: Air Gap Fire Barrier -->
  <g transform="translate(515, 100)">
    <rect width="30" height="260" rx="6" fill="#dc2626" fill-opacity="0.8"/>
    <text x="15" y="135" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 15 135)">
      AIR-GAPPED PRIVACY BARRIER
    </text>
  </g>

  <!-- Right Side: Prohibited Commercial Public LLMs -->
  <g transform="translate(560, 100)">
    <rect width="400" height="260" rx="12" fill="url(#forbiddenZone)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="35" font-family="sans-serif" font-size="15" font-weight="700" fill="#f87171">
      ✕ STRICTLY PROHIBITED EXPOSURE
    </text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#fca5a5">
      Zero Commercial Transmission &amp; Zero Public LLM Training
    </text>

    <!-- Block 1 -->
    <rect x="25" y="80" width="350" height="48" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="40" y="102" font-family="sans-serif" font-size="12" font-weight="600" fill="#fecaca">
      🚫 Public LLMs (OpenAI, Gemini, Anthropic)
    </text>
    <text x="40" y="118" font-family="sans-serif" font-size="11" fill="#f87171">
      Zero API dispatch. Emails are never exported to public cloud APIs.
    </text>

    <!-- Block 2 -->
    <rect x="25" y="140" width="350" height="48" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="40" y="162" font-family="sans-serif" font-size="12" font-weight="600" fill="#fecaca">
      🚫 Machine Learning Model Training
    </text>
    <text x="40" y="178" font-family="sans-serif" font-size="11" fill="#f87171">
      Zero data pooling or fine-tuning of foundation or proprietary models.
    </text>

    <!-- Block 3 -->
    <rect x="25" y="200" width="350" height="48" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="40" y="222" font-family="sans-serif" font-size="12" font-weight="600" fill="#fecaca">
      🚫 Commercial Behavioral Profiling
    </text>
    <text x="40" y="238" font-family="sans-serif" font-size="11" fill="#f87171">
      Zero indexing for marketing, ad-targeting, or behavioral surveillance.
    </text>
  </g>
</svg>
